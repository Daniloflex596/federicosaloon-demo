(function(){var B="/federicosaloon-demo",real=window.fetch.bind(window),cache={},cfgP=null;

return err(404,'NOT_FOUND','Non disponibile.');}).catch(function(){return err(422,'VALIDATION','Servizio non prenotabile.');});}
